name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Repository checks
        run: python tools/lint_repo.py
      - name: Script tests
        run: python -m unittest discover -s plugins/atelier-video/scripts/tests -v
      - name: End-to-end smoke test
        run: bash tools/smoke_test.sh

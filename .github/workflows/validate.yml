name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    # Pinned: Python 3.9 builds are not published for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Repository checks
        run: python tools/lint_repo.py
      - name: Script tests
        run: python -m unittest discover -s plugins/atelier-video/scripts/tests -v
      - name: End-to-end smoke test
        run: bash tools/smoke_test.sh
